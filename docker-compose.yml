services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: TaskManager
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  webapi:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5129:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      Jwt__Key: ${JWTKEY}
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=TaskManager;User=root;Password=${MYSQL_ROOT_PASSWORD}"

volumes:
  mysql_data: